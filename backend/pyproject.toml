[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimassist-backend"
version = "0.1.0"
description = "ClaimAssist AI backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "SQLAlchemy==2.0.54",
    "starlette==1.6.0",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.0",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -ra --basetemp=.tmp/pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = ["postgres_integration: requires an explicitly configured disposable PostgreSQL database"]
filterwarnings = [
    "error",
    # Starlette 1.6 uses this upstream AnyIO alias; keep the warning visible.
    "default:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/api/errors.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
exclude = ['^(build|dist|\.venv|tmp)/']
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
